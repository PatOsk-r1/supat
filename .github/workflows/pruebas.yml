# Corre las pruebas y compila cada vez que se suben cambios a main (o en un pull request).
# La app se publica solo en Firebase Hosting (https://supat-h8tfw.web.app); GitHub Pages está apagado.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
